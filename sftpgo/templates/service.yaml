{{- /* Render all the ports first: node ports must be unique across services. */}}
{{- $mainName := include "sftpgo.fullname" . }}
{{- $mainPorts := include "sftpgo.servicePorts" (dict "ctx" $ "name" $mainName "service" .Values.service "main" true) | trim }}
{{- $rendered := list (dict "name" $mainName "ports" $mainPorts) }}
{{- $servicePorts := dict }}
{{- range $name, $service := .Values.services }}
{{- $_ := required (printf "Service type is required for service %q" $name) $service.type }}
{{- $ports := include "sftpgo.servicePorts" (dict "ctx" $ "name" $name "service" $service "main" false) | trim }}
{{- $_ := set $servicePorts $name $ports }}
{{- $rendered = append $rendered (dict "name" $name "ports" $ports) }}
{{- end }}
{{- $nodePorts := dict }}
{{- range $svc := $rendered }}
{{- range $port := fromYamlArray $svc.ports }}
{{- with $port.nodePort }}
{{- $key := toString . }}
{{- with get $nodePorts $key }}
{{- $hint := ternary " (only one NodePort service can expose the FTP passive ports)" "" (hasPrefix "ftp-passive-" $port.name) }}
{{- fail (printf "Node port %s is used by both service %q and service %q%s" $key . $svc.name $hint) }}
{{- end }}
{{- $_ := set $nodePorts $key $svc.name }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpgo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    {{- $mainPorts | nindent 4 }}
  selector:
    {{- include "sftpgo.selectorLabels" . | nindent 4 }}

{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpgo.componentname" (list $ $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sftpgo.labels" $ | nindent 4 }}
    {{- with $service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ required (printf "Service type is required for service %q" $name) $service.type }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if eq $service.type "LoadBalancer" }}
  {{- with $service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with $service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    {{- get $servicePorts $name | nindent 4 }}
  selector:
    {{- include "sftpgo.selectorLabels" $ | nindent 4 }}
{{- end }}
