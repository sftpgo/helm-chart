apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpgo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
    {{- if .Values.service.labels }}
    {{ toYaml .Values.service.labels | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    {{- if .Values.sftpd.enabled }}
    - name: sftp
      port: {{ .Values.service.ports.sftp.port }}
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.sftp.nodePort }}
      nodePort: {{ .Values.service.ports.sftp.nodePort }}
      {{- end }}
      targetPort: sftp
      protocol: TCP
      appProtocol: sftp-ssh
    {{- end }}
    {{- if .Values.ftpd.enabled }}
    - name: ftp
      port: {{ .Values.service.ports.ftp.port }}
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.ftp.nodePort }}
      nodePort: {{ .Values.service.ports.ftp.nodePort }}
      {{- end }}
      targetPort: ftp
      protocol: TCP
      appProtocol: ftp
    {{- $start := int .Values.service.ports.ftp.passiveRange.start }}
    {{- $end := int (add .Values.service.ports.ftp.passiveRange.end 1) }}
    {{- range $port := untilStep $start $end 1 }}
    - name: ftp-passive-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
      appProtocol: ftp
    {{- end }}
    {{- end }}
    {{- if .Values.webdavd.enabled }}
    - name: webdav
      port: {{ .Values.service.ports.webdav.port }}
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.webdav.nodePort }}
      nodePort: {{ .Values.service.ports.webdav.nodePort }}
      {{- end }}
      targetPort: webdav
      protocol: TCP
      appProtocol: webdav
    {{- end }}
    {{- if .Values.httpd.enabled }}
    - name: http
      port: {{ .Values.service.ports.http.port }}
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.http.nodePort }}
      nodePort: {{ .Values.service.ports.http.nodePort }}
      {{- end }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{- end }}
    - name: telemetry
      port: 10000
      targetPort: telemetry
      protocol: TCP
      appProtocol: http
    {{- with .Values.additionalPorts }}
    {{- include "sftpgo.additionalServicePorts" (list $.Values.service.type .) | trim | nindent 4 }}
    {{- end }}
  selector:
    {{- include "sftpgo.selectorLabels" . | nindent 4 }}

{{- range $name, $service := .Values.services }}
{{- $ports := $service.ports | default dict }}
{{- if and (empty $ports) (empty $service.additionalPorts) }}
{{- fail (printf "At least one port is required for service %q" $name) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpgo.componentname" (list $ $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sftpgo.labels" $ | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ required (printf "Service type is required for service %q" $name) $service.type }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if eq $service.type "LoadBalancer" }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with $service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    {{- if and $.Values.sftpd.enabled $ports.sftp }}
    - name: sftp
      port: {{ required (printf "SFTP service port is required for service %q" $name) $ports.sftp.port }}
      {{- if and (or (eq $service.type "NodePort") (eq $service.type "LoadBalancer")) $ports.sftp.nodePort }}
      nodePort: {{ $ports.sftp.nodePort }}
      {{- end }}
      targetPort: sftp
      protocol: TCP
      appProtocol: sftp-ssh
    {{- end }}
    {{- if and $.Values.ftpd.enabled $ports.ftp }}
    - name: ftp
      port: {{ required (printf "SFP service port is required for service %q" $name) $ports.ftp.port }}
      {{- if and (or (eq $service.type "NodePort") (eq $service.type "LoadBalancer")) $ports.ftp.nodePort }}
      nodePort: {{ $ports.ftp.nodePort }}
      {{- end }}
      targetPort: ftp
      protocol: TCP
      appProtocol: ftp
    {{- if $ports.ftp.passiveRange }}
    {{- $start := int $ports.ftp.passiveRange.start }}
    {{- $end := int (add $ports.ftp.passiveRange.end 1) }}
    {{- range $port := untilStep $start $end 1 }}
    - name: ftp-passive-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
      appProtocol: ftp
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.webdavd.enabled $ports.webdav }}
    - name: webdav
      port: {{ required (printf "WebDAV service port is required for service %q" $name) $ports.webdav.port }}
      {{- if and (or (eq $service.type "NodePort") (eq $service.type "LoadBalancer")) $ports.webdav.nodePort }}
      nodePort: {{ $ports.webdav.nodePort }}
      {{- end }}
      targetPort: webdav
      protocol: TCP
      appProtocol: webdav
    {{- end }}
    {{- if and $.Values.httpd.enabled $ports.http }}
    - name: http
      port: {{ required (printf "HTTP service port is required for service %q" $name) $ports.http.port }}
      {{- if and (or (eq $service.type "NodePort") (eq $service.type "LoadBalancer")) $ports.http.nodePort }}
      nodePort: {{ $ports.http.nodePort }}
      {{- end }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{- end }}
    {{- with $service.additionalPorts }}
    {{- include "sftpgo.additionalServicePorts" (list $service.type .) | trim | nindent 4 }}
    {{- end }}
  selector:
    {{- include "sftpgo.selectorLabels" $ | nindent 4 }}
{{- end }}
